name: Release

# Releases are cut from a tag, and the tag is the trigger rather than a
# convenience: it means the thing that was tested is the thing that ships, and
# that the version is recorded in git rather than in a workflow input somebody
# typed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: "Publish an existing release tag to NuGet through its protected environment"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The full CI workflow - Linux, Windows and macOS builds and tests, and the lint - on exactly
  # the commit the tag names. `publish` needs it, so a release whose commit fails on any platform
  # cannot reach NuGet, whatever happened to that commit's runs before it was tagged.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Everything that can fail without consequence happens here, before the job
  # that can publish. A NuGet version cannot be unpublished and cannot be
  # replaced, so the expensive mistakes are the ones made after this point.
  verify:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # global.json holds the SDK to one feature band (10.0.4xx) and takes its security patches.
      # A new band can bring new analyzers, which fail a warnings-as-errors build with no commit
      # behind it, so prove the band held rather than trusting the setup action to have honoured
      # rollForward (setup-dotnet v4 silently did not).
      - name: SDK band
        shell: bash
        run: |
          version=$(dotnet --version)
          echo "SDK $version"
          case "$version" in
            10.0.4[0-9][0-9]) ;;
            *) echo "::error::global.json pins the 10.0.4xx band, but this job resolved SDK $version"; exit 1 ;;
          esac

      # The tag and Directory.Build.props are two places the version is
      # written, so they are two places it can disagree. Tagging v0.2.0 while
      # the props file still says 0.1.0 would otherwise publish 0.1.0 under a
      # 0.2.0 release and there is no way back from that.
      - name: Check the tag matches VersionPrefix
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [ -z "$prefix" ]; then
            echo "::error::No <VersionPrefix> found in Directory.Build.props."
            exit 1
          fi
          if [ "$tag" != "$prefix" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag, but Directory.Build.props says $prefix."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag."

      # The changelog is part of the release, so an unrecorded version is a
      # failure rather than something to notice afterwards.
      - name: Check the changelog mentions this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi

      - name: Build, test and inspect package bytes
        shell: bash
        run: bash .github/scripts/release-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            /tmp/vellumtext-packages/packages/*.nupkg
            /tmp/vellumtext-packages/packages/*.snupkg
            /tmp/vellumtext-packages/package-provenance.json
            /tmp/vellumtext-packages/SHA256SUMS
          if-no-files-found: error

      - name: Upload package-build test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-release-packages
          path: /tmp/vellumtext-packages/test-results/*.trx
          if-no-files-found: ignore

  # Split out so that publishing sits behind an environment. Give the `nuget`
  # environment a required reviewer and every release needs a human to press
  # the button, which is the only protection that actually exists against
  # publishing the wrong thing.
  publish:
    # NuGet is opt-in; GitHub release assets remain available without credentials
    # or a NuGet environment approval. Enable only after configuring its API key.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nuget && vars.NUGET_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: [ci, verify]
    environment: nuget

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Check NuGet credentials are configured
        id: credentials
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -n "${NUGET_API_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No NuGet API key is configured; packages are available from the GitHub release."
          fi

      # global.json holds the SDK to one feature band (10.0.4xx) and takes its security patches.
      # A new band can bring new analyzers, which fail a warnings-as-errors build with no commit
      # behind it, so prove the band held rather than trusting the setup action to have honoured
      # rollForward (setup-dotnet v4 silently did not).
      - name: SDK band
        shell: bash
        run: |
          version=$(dotnet --version)
          echo "SDK $version"
          case "$version" in
            10.0.4[0-9][0-9]) ;;
            *) echo "::error::global.json pins the 10.0.4xx band, but this job resolved SDK $version"; exit 1 ;;
          esac

      # The same files that were built and tested above, rather than a second
      # build that could differ from the one the tests ran against.
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Verify downloaded package identity and hashes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS
          jq -e --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            '.passed == true and .version == $version and .commit == $commit and
             (.packages | length) == 6 and (.hashes | length) == 12' package-provenance.json

      # A published NuGet version can never be replaced or withdrawn, so a
      # version that already exists is a stop, not something to skip past.
      # --skip-duplicate would accept it silently and then the GitHub release
      # below would be built from *these* binaries, leaving NuGet and GitHub
      # disagreeing about what this version is - exactly the divergence the
      # tag check in `verify` exists to prevent.
      - name: Check these versions are not already on NuGet
        if: steps.credentials.outputs.configured == 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          fail=0
          for pkg in artifacts/packages/*.nupkg; do
            id=$(basename "$pkg" ".$VERSION.nupkg")
            lower=$(printf '%s' "$id" | tr '[:upper:]' '[:lower:]')
            # `|| code=000` rather than `|| echo 000`: on a transport failure curl
            # has already written 000 via -w, so echoing another one concatenates
            # into 000000 and the operator is shown an HTTP code that does not
            # exist. The fallback is still required - without it `set -e` aborts
            # the whole step on the first unreachable package instead of
            # reporting each one.
            code=$(curl -sS --retry 3 -o versions.json \
              -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/$lower/index.json") || code=000
            case "$code" in
              404) echo "$id: not on NuGet yet."; continue ;;
              200) ;;
              # Fail closed. Not knowing whether a version exists is not the
              # same as knowing it does not.
              *) echo "::error::Could not check $id on NuGet (HTTP $code)."; fail=1; continue ;;
            esac
            if jq -e --arg v "$VERSION" '.versions | index($v)' versions.json > /dev/null; then
              echo "::error::$id $VERSION is already on NuGet. Published versions cannot be" \
                   "replaced - bump VersionPrefix, add a CHANGELOG section and tag again."
              fail=1
            else
              echo "$id: $VERSION is free."
            fi
          done
          rm -f versions.json
          exit $fail

      - name: Push to NuGet
        if: steps.credentials.outputs.configured == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "::error::The NUGET_API_KEY secret is not set on the nuget environment."
            exit 1
          fi
          # No --skip-duplicate: the check above already established that none
          # of these versions exist, so a duplicate here means something
          # changed underneath the release and is worth stopping for.
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"

  github-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [ci, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Verify downloaded package identity and hashes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS
          jq -e --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            '.passed == true and .version == $version and .commit == $commit and
             (.packages | length) == 6 and (.hashes | length) == 12' package-provenance.json

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          # Everything between this version's heading and the next one. The
          # version is passed in as an awk variable rather than interpolated
          # into the script: a tag is attacker-supplied on a public repository,
          # and its dots would otherwise be regex wildcards as well.
          awk -v ver="$VERSION" \
            '$0 ~ "^## \\["ver"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > "$notes"
          gh release create "$TAG" \
            --verify-tag \
            --title "VellumText $VERSION" \
            --notes-file "$notes" \
            artifacts/packages/*.nupkg artifacts/packages/*.snupkg \
            artifacts/package-provenance.json artifacts/SHA256SUMS
