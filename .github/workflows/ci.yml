name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors, so this covers style and nullability as well.
      - name: Build
        run: dotnet build --no-restore -c Release

      # The Avalonia tests run headlessly, so no display server is needed.
      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # Structural rules live in tools/ast-grep. `ast-grep test` checks each rule against its own
  # valid and invalid cases; `ast-grep scan` fails on any error-severity match in src/.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ast-grep
        run: npm install --global @ast-grep/cli@0.51.0

      - name: Rule tests
        run: ast-grep test --skip-snapshot-tests

      - name: Scan
        run: ast-grep scan

  pack:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Proves the packages are packable on every change rather than only at
      # release, when a missing bit of metadata is most expensive to discover.
      - name: Pack
        run: dotnet pack -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
