name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      retention_diagnostics:
        description: "Run isolated retention diagnostics instead of release qualification"
        type: boolean
        default: false
  # Release runs this whole workflow on the tagged commit, every platform included, and cannot
  # publish unless it passes. See release.yml.
  workflow_call:

permissions:
  contents: read

jobs:
  # Decides where `build` runs. Linux and Windows run on everything. macOS costs ten times the
  # minutes of Linux on a private repository, so it runs on pushes to main, on releases (which
  # arrive here as the tag's push), on a manual run, and on pull requests that change what macOS
  # actually catches: the Avalonia control and its tests, the demo, and the build itself. A pull
  # request that only touches the platform-independent libraries is still covered on macOS by
  # the push to main that merges it.
  platforms:
    runs-on: ubuntu-latest

    outputs:
      os: ${{ steps.pick.outputs.os }}

    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Pick platforms
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mac=true
          if [ "$EVENT" = pull_request ]; then
            # The list of paths that need macOS lives in the script, with its tests beside it.
            changed=$(git diff --name-only "$BASE...$HEAD")
            mac=$(bash .github/scripts/needs-macos.sh <<<"$changed")
            if [ "$mac" = true ]; then
              echo "This pull request touches Avalonia or build files; macOS runs."
            else
              echo "Nothing macOS-specific changed; macOS runs on the merge to main instead."
            fi
          fi
          if [ "$mac" = true ]; then
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: platforms

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # global.json holds the SDK to one feature band (10.0.4xx) and takes its security patches.
      # A new band can bring new analyzers, which fail a warnings-as-errors build with no commit
      # behind it, so prove the band held rather than trusting the setup action to have honoured
      # rollForward (setup-dotnet v4 silently did not).
      - name: SDK band
        shell: bash
        run: |
          version=$(dotnet --version)
          echo "SDK $version"
          case "$version" in
            10.0.4[0-9][0-9]) ;;
            *) echo "::error::global.json pins the 10.0.4xx band, but this job resolved SDK $version"; exit 1 ;;
          esac

      - name: Restore
        run: dotnet restore

      # Warnings are errors, so this covers style and nullability as well.
      - name: Build
        run: dotnet build --no-restore -c Release

      # The Avalonia tests run headlessly, so no display server is needed.
      - name: Test
        if: inputs.retention_diagnostics != true
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Retention diagnostics
        if: inputs.retention_diagnostics == true
        shell: bash
        run: |
          set -euo pipefail
          for rows in 2500 5000 10000; do
            echo "rows=$rows ordinary heap (without instrumentation)"
            dotnet tests/VellumText.LayoutProbe/bin/Release/net10.0/VellumText.LayoutProbe.dll 3 "$rows" traverse side
            echo "rows=$rows weak-view diagnostics (heap includes diagnostic references)"
            dotnet tests/VellumText.LayoutProbe/bin/Release/net10.0/VellumText.LayoutProbe.dll 3 "$rows" retention-diagnostics side
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # Structural rules live in tools/ast-grep. `ast-grep test` checks each rule against its own
  # valid and invalid cases; `ast-grep scan` fails on any error-severity match in src/.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The platform picker decides whether macOS runs at all, so a bug in it fails silently.
      - name: Workflow script tests
        run: bash .github/scripts/needs-macos.test.sh

      - name: Install ast-grep
        run: npm install --global @ast-grep/cli@0.51.0

      - name: Rule tests
        run: ast-grep test --skip-snapshot-tests

      - name: Scan
        run: ast-grep scan

  pack:
    runs-on: ubuntu-latest
    # This job builds and tests its own inspected bytes. Run it independently so
    # a platform failure cannot hide a separate packaging defect.
    needs: platforms

    # On a release this workflow runs inside Release's own run, whose verify job packs and
    # uploads `packages` itself. A second artifact of that name in one run fails the upload.
    if: github.ref_type != 'tag' && inputs.retention_diagnostics != true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # global.json holds the SDK to one feature band (10.0.4xx) and takes its security patches.
      # A new band can bring new analyzers, which fail a warnings-as-errors build with no commit
      # behind it, so prove the band held rather than trusting the setup action to have honoured
      # rollForward (setup-dotnet v4 silently did not).
      - name: SDK band
        shell: bash
        run: |
          version=$(dotnet --version)
          echo "SDK $version"
          case "$version" in
            10.0.4[0-9][0-9]) ;;
            *) echo "::error::global.json pins the 10.0.4xx band, but this job resolved SDK $version"; exit 1 ;;
          esac

      # Proves the packages are packable on every change rather than only at
      # release, when a missing bit of metadata is most expensive to discover.
      - name: Build, test and inspect package bytes
        shell: bash
        run: bash .github/scripts/release-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            /tmp/vellumtext-packages/packages/*.nupkg
            /tmp/vellumtext-packages/packages/*.snupkg
            /tmp/vellumtext-packages/package-provenance.json
            /tmp/vellumtext-packages/SHA256SUMS
          if-no-files-found: error

      - name: Upload package-build test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-packages
          path: /tmp/vellumtext-packages/test-results/*.trx
          if-no-files-found: ignore

      - name: Upload package inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-inspection
          path: /tmp/vellumtext-packages/package-provenance.json
          if-no-files-found: ignore
